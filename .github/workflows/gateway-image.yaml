name: gateway-image
# The autopilot-gateway image (Dockerfile): Clearance at its pinned tag with Autopilot's Hangar backends. Built for
# linux/amd64 and linux/arm64 (hangar-prod and hangar-dev) when a gateway-v* tag is pushed, and pushed to
# ghcr.io/jfillman/autopilot-gateway under that tag. A new ghcr.io package is private: make it public once (or give the
# cluster a pull secret). Pin the deployment by tag and digest.
on:
  push:
    tags: ["gateway-v*"]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/jfillman/autopilot-gateway:${{ github.ref_name }}
          provenance: false
      - run: echo "ghcr.io/jfillman/autopilot-gateway:${{ github.ref_name }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
