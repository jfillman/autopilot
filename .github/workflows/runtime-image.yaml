name: runtime-image
# The autopilot-agent-runtime image (runtime/Dockerfile): the generic agent runtime an AgentRun pod runs. Built for
# linux/amd64 and linux/arm64 (hangar-prod and hangar-dev) when a runtime-v* tag is pushed, and pushed to
# ghcr.io/jfillman/autopilot-agent-runtime under that tag. A new ghcr.io package is private: make it public once (or
# give the cluster a pull secret). Pin agent definitions' runtime.image by digest.
on:
  push:
    tags: ["runtime-v*", "runtime-base-python-v*", "runtime-langgraph-v*", "runtime-claude-agent-sdk-v*"]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Which image the tag names (runtime/catalog.yaml): runtime-v* is the generic runtime, runtime-<name>-v* another.
      - id: which
        run: |
          case "${GITHUB_REF_NAME}" in
            runtime-base-python-v*) echo "file=runtime/base-python/Dockerfile" >> "$GITHUB_OUTPUT"; echo "repo=ghcr.io/jfillman/autopilot-agent-base-python" >> "$GITHUB_OUTPUT" ;;
            runtime-langgraph-v*)   echo "file=runtime/langgraph/Dockerfile" >> "$GITHUB_OUTPUT"; echo "repo=ghcr.io/jfillman/autopilot-agent-langgraph" >> "$GITHUB_OUTPUT" ;;
            runtime-claude-agent-sdk-v*) echo "file=runtime/claude-agent-sdk/Dockerfile" >> "$GITHUB_OUTPUT"; echo "repo=ghcr.io/jfillman/autopilot-agent-claude-agent-sdk" >> "$GITHUB_OUTPUT" ;;
            runtime-v*)             echo "file=runtime/Dockerfile" >> "$GITHUB_OUTPUT"; echo "repo=ghcr.io/jfillman/autopilot-agent-runtime" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown runtime tag ${GITHUB_REF_NAME}" >&2; exit 1 ;;
          esac
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: runtime
          file: ${{ steps.which.outputs.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.which.outputs.repo }}:${{ github.ref_name }}
          provenance: false
      - run: echo "${{ steps.which.outputs.repo }}:${{ github.ref_name }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
