name: test
on: [push, pull_request]
env:
  # glidepath ref whose contract the test core's Hangar bundle reads its cicd.yaml scope from (tests/test_cicd_scope.py:
  # contractsrv serves it as glidepath-api's GET /v1/contract).
  GLIDEPATH_REF: main
  # The Clearance core the gateway is tested against: the release whose client pyproject.toml pins
  # (clearance-core-client @ ...@<tag or full commit SHA>). Bump the two together.
  CLEARANCE_REF: 7c1a4aef5ea52f873efdee6a908188878c4341fa
  # The Go gateway (gateway/, A-9) imports Clearance's Go client from the same release: gateway/go.mod requires
  # github.com/jfillman/clearance at this ref. Bump the three together.
jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      # Scratch databases for the gateway's own database and the R-4 cutover copy (tests/test_gateway_pg.py).
      postgres:
        # postgres:17, multi-arch index (2026-11-03), pinned like every base image (tests/test_definitions_backed.py).
        image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # airframe's contract (AppSpec, XRDs) for the tests tied to the real contracts
      - uses: actions/checkout@v4
        with:
          repository: jfillman/airframe
          path: tech/airframe
      # glidepath's contract: the Hangar bundle's source (tests/clearance_core/contractsrv.py serves it)
      - uses: actions/checkout@v4
        with:
          repository: jfillman/glidepath
          ref: ${{ env.GLIDEPATH_REF }}
          path: tech/glidepath
      # The Clearance core at the pinned release: the test core is a plain `go build ./cmd/clearance` of it
      # (tests/conftest.py), run as `clearance core --memory --insecure-dev-auth --max-clock-skew 0`.
      - uses: actions/checkout@v4
        with:
          repository: jfillman/clearance
          ref: ${{ env.CLEARANCE_REF }}
          path: tech/clearance
      - uses: actions/setup-go@v5
        with:
          go-version-file: tech/clearance/go.mod
          cache-dependency-path: tech/clearance/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[test]"
      # The released core image, unmodified (tests/test_core_container.py). A commit pin has no released image
      # yet: the image is built from the same checkout with the release's Dockerfile.
      - name: Start the core container
        run: |
          # Hangar's policy bundle and its glidepath source (a file here; the suite's test core reads it over HTTP),
          # and the names Hangar passes the core (policy/hangar/core-env.json).
          IMG=ghcr.io/jfillman/clearance:${CLEARANCE_REF}
          docker pull "$IMG" || docker build -t "$IMG" tech/clearance
          python -c 'import json; [print(f"{k}={v}") for k, v in json.load(open("policy/hangar/core-env.json")).items() if not k.startswith("$")]' > "$RUNNER_TEMP/core.env"
          docker run -d --name clearance-core -p 8089:8080 --env-file "$RUNNER_TEMP/core.env" \
            -v "$PWD/policy/hangar:/etc/clearance/bundles/hangar:ro" -v "$PWD/tech/glidepath/contract:/etc/clearance/sources/glidepath:ro" \
            -e CLEARANCE_BUNDLES=/etc/clearance/bundles/hangar/bundle.json \
            -e 'CLEARANCE_BUNDLE_SOURCES={"glidepath":{"file":"/etc/clearance/sources/glidepath/glidepath-contract.json"}}' \
            -e 'CLEARANCE_PROVIDERS=[{"name":"autopilot-gateway","version":"ci","principals":["autopilot-system/autopilot-gateway"],"definitions":true}]' \
            "$IMG" core --memory --insecure-dev-auth
          for i in $(seq 30); do curl -sf http://127.0.0.1:8089/readyz && break; sleep 1; done
      # A-6: every Preflight case's scripted good run passes and its seeded bad run fails (exit 1 otherwise).
      - run: autopilot preflight run --all
      - run: pytest -q
        env:
          HANGAR_TECH: ${{ github.workspace }}/tech
          CLEARANCE_SRC: ${{ github.workspace }}/tech/clearance
          AUTOPILOT_TEST_PG: postgresql://postgres:pw@127.0.0.1:5432/postgres
          AUTOPILOT_CORE_CONTAINER_URL: http://127.0.0.1:8089
          # A-1: the released core image runs the provider conformance harness against the gateway's test-only control
          # interface (tests/test_conformance.py; the plain binary runs it too). --network host: the harness's core
          # and fake target listen on the runner's loopback, where the control interface is bound.
          AUTOPILOT_CONFORMANCE_IMAGE: ghcr.io/jfillman/clearance:${{ env.CLEARANCE_REF }}
          CONFORMANCE_REPORT_DIR: ${{ runner.temp }}/conformance
      # A-9: the Go gateway's overhead per tool call at 200 concurrent sessions, reported (shared runners are too noisy to
      # assert a 5 ms p99 on; AUTOPILOT_LOADTEST=1 asserts it, on hardware that is not shared).
      - name: Go gateway load test (report)
        working-directory: gateway
        run: go test -count=1 -v -run TestGatewayOverheadPerToolCall ./internal/loadtest 2>&1 | tee "$RUNNER_TEMP/go-gateway-load.txt"
        env:
          AUTOPILOT_LOADTEST: report
      - name: Go gateway load test summary
        if: always()
        run: |
          { echo '### Go gateway load test (200 sessions, report only)'; echo '```'; grep -E 'load_test.go' "$RUNNER_TEMP/go-gateway-load.txt" | sed 's/^ *load_test.go:[0-9]*: //'; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Conformance reports
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          d = pathlib.Path(os.environ["RUNNER_TEMP"], "conformance")
          for p in sorted(d.glob("*.json")) if d.is_dir() else []:
              r = json.loads(p.read_text())
              print(f"### {p.stem}: {'PASS' if r['pass'] else 'FAIL'} ({r['suite']}, {r['provider'].get('name')} {r['provider'].get('version')})")
              for a in r["assertions"]:
                  print(f"- {'PASS' if a['pass'] else 'FAIL'} `{a['id']}`: {a.get('detail', '')}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-reports
          path: ${{ runner.temp }}/conformance
          if-no-files-found: warn
