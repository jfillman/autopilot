name: test
on: [push, pull_request]
env:
  # glidepath ref the cicd.yaml scope drift test compares against (tests/test_cicd_scope.py).
  GLIDEPATH_REF: main
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # airframe's contract (AppSpec, XRDs) for the tests tied to the real contracts
      - uses: actions/checkout@v4
        with:
          repository: jfillman/airframe
          path: tech/airframe
      # glidepath's cicd.yaml scope rules and contract, vendored under src/clearance/vendor/
      - uses: actions/checkout@v4
        with:
          repository: jfillman/glidepath
          ref: ${{ env.GLIDEPATH_REF }}
          path: tech/glidepath
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[test]"
      - run: pytest -q
        env:
          HANGAR_TECH: ${{ github.workspace }}/tech
