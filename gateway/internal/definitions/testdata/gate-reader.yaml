name: gate-reader
description: "Summarises gate-api's pipeline: the latest run, its outcome and anything a person should look at."
owner: group:default/team-platform
kind: task
# The first agent whose definition lives in the app's own repository and is made live by an Agent pin
# (tenants/gate-api/xr-requests/gate-reader.yaml; airframe docs/admin/agent.md). Read-only on purpose: a T0 task agent
# with Glidepath reads only, no repository access, no trigger. Launched by hand, it reads gate-api's recent pipeline
# runs and says what it sees. It exists to prove the pin path end to end (Clearance loads it from this file at the
# pinned commit) before any agent with authority is defined this way.
identity: { type: workload, serviceAccount: autopilot-runs/gate-reader }
profile:
  tierCeiling: T0
  tools: [glidepath.runs.list, glidepath.run.get, glidepath.explain]
  glidepath: { apps: ["gate-api"] }
  models: [claude-sonnet-5-5]
  network: clearance+model
  compute: small
  limits: { ttlMinutes: 10, toolCalls: 20, githubCalls: 0, openPrs: 0, modelTokens: 100000, children: 0 }
runtime:
  # autopilot-agent-runtime runtime-v0.1.7 (autopilot runtime/; reads AUTOPILOT_URL and the autopilot-audience token, which
  # the gateway's run pods carry since R-10b and carry alone since R-10e), the image every bundled agent runs.
  image: ghcr.io/jfillman/autopilot-agent-runtime@sha256:b5c9832f0d5d092e616a98e365862eb1e03a15dffe2d545f97c9adfed7f1d965
  framework: generic
  instructions: >-
    List gate-api's recent pipeline runs (glidepath.runs.list), read the latest one (glidepath.run.get) and Glidepath's
    explanation of it (glidepath.explain). Change nothing: you have no repository access and no PR budget. Finish with
    one paragraph: the state of gate-api's pipeline, the last run's outcome, and anything a person should look at.
triggers:
  - { type: manual }
