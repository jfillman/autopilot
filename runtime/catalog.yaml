# The runtime catalog (Autopilot's runtime image library, decided 2026-10-31): the agent images Hangar offers.
# The gateway hands it to Clearance (clearance runtimes.py): an available `runtime` image is what a definition's
# runtime.image may pin (beside RUNTIME_IMAGES_EXTRA globs for images Glidepath builds for an agent's own repo), a
# `base` image is a FROM image for code agents, and clearance-api lists all of it at GET /v1/runtimes for the New
# agent picker. Every image speaks the same contract (README "The agent runtime": the HANGAR_* environment, the
# projected tokens, /run/output/result.json). Each is built multi-arch by .github/workflows/runtime-image.yaml from
# a tag `runtime-<name>-v*` (generic keeps its `runtime-v*` tags) and pinned here by its index digest.
runtimes:
  - name: generic
    image: ghcr.io/jfillman/autopilot-agent-runtime@sha256:b1c7b65ba8405726879f27f18982d455cdb4f6c25cdb09eddd642b21e8fbbe6a
    kind: runtime
    framework: generic
    summary: "The generic loop (runtime/src/hangar_agent): the definition's instructions to the model through Clearance's model proxy, its tools through Clearance, result.json at the end, handed to Clearance (run_finish). Prompt-only agents. runtime-v0.1.6."
    status: available
  - name: base-python
    image: ghcr.io/jfillman/autopilot-agent-base-python@sha256:f8dd51864f8e2b70f165dfb38b90e16d6d99db4e6b0c0c236d460ce07799715a
    kind: base
    framework: generic
    summary: "FROM image for a Python code agent: python 3.13-slim, non-root, read-only-root ready, with hangar_agent installed as a library (env, the Clearance client with finish() for run_finish, the model-proxy client, result.json). Your entrypoint, our contract."
    status: available        # runtime-base-python-v0.1.4
  - name: claude-agent-sdk
    image: ghcr.io/jfillman/autopilot-agent-claude-agent-sdk@sha256:9048eeff4dbb6de27e3c1a8e37e6856408e5cb5c7d0336a592b80e6f0c494e99
    kind: runtime
    framework: claude-agent-sdk
    summary: "Claude Code's agent loop (the Claude Agent SDK's bundled CLI) with no built-in tools: Clearance's tools as in-process MCP tools, the model proxy as its API (streaming, clearance v0.26.0). Prompt-only agents. runtime-claude-agent-sdk-v0.1.3."
    status: available
  - name: langgraph
    image: ghcr.io/jfillman/autopilot-agent-langgraph@sha256:26cc2899cd120be06dbc6cc678ae4d639e2cdf50fe720062c0959c0b554cb30c
    kind: runtime
    framework: langgraph
    summary: "The generic loop as a LangGraph graph: a model node (the model proxy) and a tools node (Clearance). Prompt-only agents, or FROM it for a graph of your own. runtime-langgraph-v0.1.3."
    status: available
