# The runtime catalog (Autopilot's runtime image library, decided 2026-10-31): the agent images Hangar offers.
# The gateway hands it to Clearance (clearance runtimes.py): an available `runtime` image is what a definition's
# runtime.image may pin (beside RUNTIME_IMAGES_EXTRA globs for images Glidepath builds for an agent's own repo), a
# `base` image is a FROM image for code agents, and clearance-api lists all of it at GET /v1/runtimes for the New
# agent picker. Every image speaks the same contract (README "The agent runtime": the HANGAR_* environment, the
# projected tokens, /run/output/result.json). Each is built multi-arch by .github/workflows/runtime-image.yaml from
# a tag `runtime-<name>-v*` (generic keeps its `runtime-v*` tags) and pinned here by its index digest.
runtimes:
  - name: generic
    image: ghcr.io/jfillman/autopilot-agent-runtime@sha256:9231350fb98d5a0f71ce705669e921cba38e91928096b435faa49246d655f083
    kind: runtime
    framework: generic
    summary: "The generic loop (runtime/src/hangar_agent): the definition's instructions to the model through Clearance's model proxy, its tools through Clearance, result.json at the end, handed to Clearance (run_finish). Prompt-only agents. runtime-v0.1.3."
    status: available
  - name: base-python
    image: ghcr.io/jfillman/autopilot-agent-base-python@sha256:f7d662dd31ac0386ec34c24d687bd5d5925ebd17e0a16693082c237c03ad6fb2
    kind: base
    framework: generic
    summary: "FROM image for a Python code agent: python 3.13-slim, non-root, read-only-root ready, with hangar_agent installed as a library (env, the Clearance client with finish() for run_finish, the model-proxy client, result.json). Your entrypoint, our contract."
    status: available        # runtime-base-python-v0.1.1
  - name: claude-agent-sdk
    image: ghcr.io/jfillman/autopilot-agent-claude-agent-sdk@sha256:1057c0532f1ef0bdba95ea47e6dc06914f8bcfe7fc12cd3d58617ff003372310
    kind: runtime
    framework: claude-agent-sdk
    summary: "Claude Code's agent loop (the Claude Agent SDK's bundled CLI) with no built-in tools: Clearance's tools as in-process MCP tools, the model proxy as its API (streaming, clearance v0.26.0). Prompt-only agents. runtime-claude-agent-sdk-v0.1.0."
    status: available
  - name: langgraph
    image: ghcr.io/jfillman/autopilot-agent-langgraph@sha256:6ea5c23344dad7948ae32b1459eb5a488e53e72a5050c641411dcf00a5828aa7
    kind: runtime
    framework: langgraph
    summary: "The generic loop as a LangGraph graph: a model node (the model proxy) and a tools node (Clearance). Prompt-only agents, or FROM it for a graph of your own. runtime-langgraph-v0.1.0."
    status: available
