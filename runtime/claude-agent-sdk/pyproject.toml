[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hangar-claude-agent-sdk-runtime"
version = "0.1.0"
description = "The Claude Agent SDK runtime for Autopilot AgentRun pods: Claude Code's loop over Clearance's tools"
requires-python = ">=3.11"
# hangar_agent (../src) is copied into the image; its model SDK is here only because hangar_agent imports it. The SDK
# wheel bundles the Claude Code CLI. The image installs the hashed lock (requirements.lock, made by
# `uv pip compile pyproject.toml --universal --generate-hashes --python-version 3.13 -o requirements.lock`).
dependencies = ["anthropic>=0.40,<3", "claude-agent-sdk>=0.2.176,<0.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/hangar_claude"]
