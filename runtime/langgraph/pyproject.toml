[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hangar-langgraph-runtime"
version = "0.1.0"
description = "The LangGraph agent runtime for Autopilot AgentRun pods: the generic loop as a LangGraph graph"
requires-python = ">=3.11"
# hangar_agent (../src) is copied into the image, not a dependency; its one dependency (the model SDK) is here too.
# The image installs the hashed lock (requirements.lock, made by
# `uv pip compile pyproject.toml --universal --generate-hashes --python-version 3.13 -o requirements.lock`).
dependencies = ["anthropic>=0.40,<3", "langgraph>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/hangar_langgraph"]
