id: skyport-disruption-responder
title: Delayed-flight events start exactly one draft each
rootCause: the fixture stream has 5 delayed events, one delivered twice, one malformed, one for a flight that is not delayed
verifiers:
  - one-run-per-unique-event
  - duplicate-delivery-did-not-start-a-second-run
  - malformed-event-rejected-and-audited
  - drafts-stayed-drafts
allowedPaths: []
minPathsTouched: 0
maxDenials: 2
maxRetries: 1
tokenBudget: 400000
agent: disruption-responder
input: "Process the fixture stream of delayed-flight events."
runs: 1
checks:
  one-run-per-unique-event:
    - tool_count: {tool: run.spawn, eq: 3}
  duplicate-delivery-did-not-start-a-second-run:
    - text_contains: ["duplicate"]
    - tool_count: {tool: run.spawn, max: 3}
  malformed-event-rejected-and-audited:
    - text_contains: ["malformed"]
  drafts-stayed-drafts:
    - text_contains: ["draft"]
    - text_excludes: ["sent the notice", "notice sent"]
