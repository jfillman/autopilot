# SERVICE agent. Always on, public-facing chat about flight status. It is an ordinary Airframe
# application (PythonApplication + Redis), so it has no AgentRun: the airframe-application chart's
# `agent:` block gives its pods the same runtime contract and identity a run gets.
name: passenger-assistant
description: "An always-on public chat answering passengers' flight-status questions."
owner: group:default/team-skyport
kind: service
identity: { type: workload, serviceAccount: app-passenger-assistant-dev/passenger-assistant }
profile:
  tierCeiling: T0
  tools: [app.api.get]
  apis: { allow: [boarding-api, flight-api] }
  models: [claude-sonnet-5-5]
  network: clearance+model
  compute: small
  limits: { ttlMinutes: 1440, toolCalls: 5000, githubCalls: 0, openPrs: 0, modelTokens: 2000000, children: 0 }
runtime:
  image: ghcr.io/jfillman/autopilot-agent-runtime@sha256:628e623ce1f24032d9622c3fad2368a337190708e5deb63b5c4b02b896db2f1b
  framework: generic
  sandbox: hardened
triggers: [ { type: manual } ]
