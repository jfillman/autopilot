# TEAM worker. Finds which flights, gates and bags a disruption touches.
name: ops-researcher
description: "Finds which flights, gates and bags a Skyport disruption touches."
owner: group:default/team-skyport
kind: task
identity: { type: delegated }
profile:
  tierCeiling: T1
  tools: [app.api.get, metrics.query, artifact.put]
  apis: { allow: [flight-api, boarding-api, baggage-api] }
  models: [claude-sonnet-5-5]
  network: clearance+model
  compute: small
  limits: { ttlMinutes: 15, toolCalls: 50, githubCalls: 0, openPrs: 0, modelTokens: 150000, children: 0 }
runtime:
  image: ghcr.io/jfillman/autopilot-agent-runtime@sha256:628e623ce1f24032d9622c3fad2368a337190708e5deb63b5c4b02b896db2f1b
  framework: generic
  sandbox: standard
triggers: [ { type: manual } ]
