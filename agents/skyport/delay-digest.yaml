# SCHEDULED agent. Once a day, summarise delays and gate changes into a report.
name: delay-digest
description: "Once a day, summarises Skyport flight delays and gate changes into a report."
owner: group:default/team-skyport
kind: scheduled
identity: { type: workload, serviceAccount: autopilot-runs/delay-digest }
profile:
  tierCeiling: T1
  tools: [app.api.get, metrics.query, artifact.put]
  apis: { allow: [flight-api] }
  models: [claude-sonnet-5-5]
  network: clearance+model
  compute: small
  limits: { ttlMinutes: 30, toolCalls: 100, githubCalls: 0, openPrs: 0, modelTokens: 300000, children: 0 }
runtime:
  image: ghcr.io/jfillman/autopilot-agent-runtime@sha256:9231350fb98d5a0f71ce705669e921cba38e91928096b435faa49246d655f083
  framework: generic
  sandbox: standard
triggers:
  - { type: interval, every: 24h }
