# TASK agent. Run to completion. A person asks for a brief on one flight; the agent reads the
# three Skyport APIs and writes a structured brief. Read-only: T0.
name: flight-briefer
description: "Briefs a person on one Skyport flight from the flight, gate and baggage APIs."
owner: group:default/team-skyport
kind: task
identity: { type: delegated }
profile:
  tierCeiling: T1
  tools: [app.api.get, catalog.read, metrics.query, artifact.put]
  apis: { allow: [flight-api, boarding-api, baggage-api] }
  models: [claude-sonnet-5-5]
  network: clearance+model
  compute: small
  limits: { ttlMinutes: 10, toolCalls: 40, githubCalls: 0, openPrs: 0, modelTokens: 120000, children: 0 }
runtime:
  image: ghcr.io/jfillman/autopilot-agent-runtime@sha256:b1c7b65ba8405726879f27f18982d455cdb4f6c25cdb09eddd642b21e8fbbe6a
  framework: claude-agent-sdk
  sandbox: standard
triggers: [ { type: manual } ]
