# TEAM worker. Drafts passenger and crew notices. Drafts only.
name: ops-drafter
description: "Drafts passenger and crew notices for an irregular-ops response; drafts only."
owner: group:default/team-skyport
kind: task
identity: { type: delegated }
profile:
  tierCeiling: T1
  tools: [app.api.get, artifact.get, artifact.put]
  apis: { allow: [flight-api, boarding-api, baggage-api] }
  models: [claude-sonnet-5-5]
  network: clearance+model
  compute: small
  limits: { ttlMinutes: 15, toolCalls: 30, githubCalls: 0, openPrs: 0, modelTokens: 150000, children: 0 }
runtime:
  image: ghcr.io/jfillman/autopilot-agent-runtime@sha256:b5c9832f0d5d092e616a98e365862eb1e03a15dffe2d545f97c9adfed7f1d965
  framework: generic
  sandbox: standard
triggers: [ { type: manual } ]
