# TEAM orchestrator. Spawned by the responder for a major disruption. Plans, then delegates to three
# narrower workers. It cannot do anything its parent could not, and a parent must itself hold every
# tool it delegates: a child's tools are its own list intersected with its parent's.
name: irregular-ops-team
description: "Plans the response to a major Skyport disruption and delegates research, drafting and checking to its workers."
owner: group:default/team-skyport
kind: team
identity: { type: delegated }
profile:
  tierCeiling: T1
  tools: [app.api.get, metrics.query, artifact.get, artifact.put, run.spawn, run.close, human.request]
  apis: { allow: [flight-api, boarding-api, baggage-api] }
  models: [claude-sonnet-5-5]
  network: clearance+model
  compute: small
  limits: { ttlMinutes: 30, toolCalls: 120, githubCalls: 0, openPrs: 0, modelTokens: 600000, children: 3 }
runtime:
  image: ghcr.io/jfillman/autopilot-agent-runtime@sha256:628e623ce1f24032d9622c3fad2368a337190708e5deb63b5c4b02b896db2f1b
  framework: langgraph
  sandbox: standard
triggers: [ { type: manual } ]
