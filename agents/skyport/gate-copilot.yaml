# SESSION agent. A gate agent asks from Tower; the agent answers questions and drafts announcements. It never
# acts on its own: anything consequential, and every reply it needs, goes through human.request.
name: gate-copilot
description: "Chats with a gate agent in Tower: answers questions and drafts notices for one gate."
owner: group:default/team-skyport
kind: session
identity: { type: delegated }
profile:
  tierCeiling: T0
  # The gate agent's questions arrive as the run's prompt and its answers go back through the human inbox
  # (human.request, read with human.request.get); chat.* has no backend until Tower's chat surface (A-8).
  tools: [app.api.get, catalog.read, human.request, human.request.get]
  apis: { allow: [flight-api, boarding-api, baggage-api] }
  models: [claude-sonnet-5-5]
  network: clearance+model
  compute: small
  limits: { ttlMinutes: 60, toolCalls: 300, githubCalls: 0, openPrs: 0, modelTokens: 400000, children: 0 }
runtime:
  image: ghcr.io/jfillman/autopilot-agent-runtime@sha256:ae7ba756d0a16676e7bc90fbe1d500b0dc5654e4650b82a06f079387e47bb4ae
  framework: langgraph
  sandbox: standard
triggers: [ { type: manual } ]
