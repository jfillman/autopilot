# TEAM worker. Checks every fact in a draft against the APIs.
name: ops-checker
description: "Checks every fact in an irregular-ops draft against the Skyport APIs."
owner: group:default/team-skyport
kind: task
identity: { type: delegated }
profile:
  tierCeiling: T0
  tools: [app.api.get, artifact.get]
  apis: { allow: [flight-api, boarding-api, baggage-api] }
  models: [claude-sonnet-5-5]
  network: clearance+model
  compute: small
  limits: { ttlMinutes: 15, toolCalls: 30, githubCalls: 0, openPrs: 0, modelTokens: 100000, children: 0 }
runtime:
  image: ghcr.io/jfillman/autopilot-agent-runtime@sha256:b5c9832f0d5d092e616a98e365862eb1e03a15dffe2d545f97c9adfed7f1d965
  framework: generic
  sandbox: standard
triggers: [ { type: manual } ]
