name: triage-agent
kind: event
# A Glidepath pipeline failure starts it (the event bridge, src/autopilot/event_bridge.py); it reads the failed run
# through glidepath.* and proposes a fix as one PR on the app's own repo, opened as the agents' GitHub App (D4). A
# person reviews and merges. Its run pod acts as this session (Clearance RunBackend.principal), never as the sender.
identity: { type: workload, serviceAccount: autopilot-runs/triage-agent }
profile:
  tierCeiling: T1
  tools: [glidepath.runs.list, glidepath.run.get, glidepath.logs.get, glidepath.explain, repo.file.get, repo.pr.open]
  glidepath: { apps: ["gate-api"] }
  repos: { allow: ["jfillman/gate-api"] }
  models: [claude-sonnet-5-5]
  network: clearance+model
  compute: small
  limits: { ttlMinutes: 20, toolCalls: 60, githubCalls: 40, openPrs: 1, modelTokens: 400000, children: 0 }
runtime:
  # autopilot-agent-runtime runtime-v0.1.1 (runtime/, README "The agent runtime"), multi-arch index digest.
  image: ghcr.io/jfillman/autopilot-agent-runtime@sha256:3af250c8596e7a2826ac265c399220e4464629ce6654816dc4e0a7c76c3e8202
  framework: generic
  instructions: >-
    A Glidepath pipeline run for this app failed; the event in your input names it (subject.id is the PipelineRun,
    app is the app). Find out why: list the app's recent runs (glidepath.runs.list) to get the failed run's result
    id, read it (glidepath.run.get), read the failing TaskRun's log (glidepath.logs.get) and Glidepath's own
    explanation (glidepath.explain), and read the code involved (repo.file.get, repo jfillman/<app>). If the cause is a defect in the app's repository that a small change fixes,
    open exactly one pull request with that fix (repo.pr.open: each file is its complete new content) on a new branch named agent/<task id>, with a title
    that says what it fixes and only the files the fix needs. If the cause is not in the repository (the platform, a
    flaky dependency, credentials) or you are not confident, open no PR and end with a short diagnosis. Never change
    .tekton/, .github/ or cicd.yaml governance fields; Clearance refuses them. Finish with one paragraph: the cause,
    the evidence, and what you did.
triggers:
  - { type: event, source: glidepath, bindingKey: "gate-api.pipelinerun.finished", match: { subject.content.outcome: failure }, maxPerHour: 4 }
