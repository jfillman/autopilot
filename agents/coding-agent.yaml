name: coding-agent
description: "Makes a change in an app's repository and opens it as a pull request for a person to review and merge."
owner: group:default/team-platform
kind: task
identity: { type: delegated }
profile:
  tierCeiling: T1
  # repo.file.get: an agent that opens a fix PR must read the files it changes first (2026-11-03: a live run had no
  # file-read tool and answered that it could not make the change).
  tools: [catalog.read, metrics.query, logs.query, argo.app.get, repo.file.get, repo.pr.open, xr.request, argo.sync.lower, glidepath.run.rerun, glidepath.run.cancel, glidepath.live.list, glidepath.live.watch, glidepath.previews.list, glidepath.cicd.validate, glidepath.cicd.propose, run.spawn, run.close, human.request, repo.pr.open_upper]
  repos: { allow: ["jfillman/*"] }
  glidepath: { apps: ["*"] }
  models: [claude-sonnet-5-5]
  network: clearance+model
  compute: small
  limits: { ttlMinutes: 30, toolCalls: 200, githubCalls: 300, openPrs: 3, modelTokens: 500000, children: 2 }
runtime:
  image: ghcr.io/jfillman/autopilot-agent-runtime@sha256:b5c9832f0d5d092e616a98e365862eb1e03a15dffe2d545f97c9adfed7f1d965
  framework: claude-agent-sdk
  sandbox: standard
triggers: [ { type: manual } ]
