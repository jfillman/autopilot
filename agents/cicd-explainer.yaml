name: cicd-explainer
description: "Explains a Glidepath pipeline run or release: what ran, what failed and why; changes nothing."
owner: group:default/team-platform
kind: task
identity: { type: delegated }
profile:
  tierCeiling: T0
  tools: [glidepath.runs.list, glidepath.run.get, glidepath.logs.get, glidepath.explain, glidepath.releases.get, glidepath.contract,
          glidepath.live.list, glidepath.live.logs.get, glidepath.tests.list, glidepath.tests.report,
          glidepath.evidence.get, glidepath.events.recent, glidepath.previews.list]
  glidepath: { apps: ["*"] }
  models: [claude-sonnet-5-5]
  network: clearance+model
  compute: small
  limits: { ttlMinutes: 15, toolCalls: 40, githubCalls: 0, openPrs: 0, modelTokens: 200000, children: 0 }
runtime:
  image: ghcr.io/jfillman/autopilot-agent-runtime@sha256:9231350fb98d5a0f71ce705669e921cba38e91928096b435faa49246d655f083
  framework: generic
