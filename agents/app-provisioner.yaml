name: app-provisioner
description: "Provisions any app from an AppSpec, or from a plain-language request turned into one: opens each step of its plan as a pull request for a person to merge, and picks up where an earlier run stopped."
owner: group:default/team-platform
kind: task
identity: { type: delegated }
# The general provisioning agent, beside agents/parachute.yaml. parachute is the narrow A-3 test agent (app `parachute`
# only, R023); this one stands up ANY app from an AppSpec with any option the Airframe planner supports, through the same
# airframe.apply tool, so authority is wider here by design (profile.airframe.apps "*", repos.allow "jfillman/*"). What
# bounds it is unchanged from parachute: T1; its one write is airframe.apply, which opens PRs through the agents' GitHub
# App and only to the tenants repo, the app's repo and its gitops repo; no merge, approve or push tool, so a person merges
# every PR. proposeFlight: true (owner decision 2026-11-12: "when I ask the agent to configure the app, it should configure
# all the envs I specify", a person approving anything that touches prod) is what lets it open the Flight half too, as
# Glidepath's `propose` class: Flight environments and the release step in cicd.yaml, and the Flight values in gitops-<app>,
# each PR marked for a person to merge (Clearance / agent-scope is neutral "needs a person" until one does, and fails if a
# bot or an agent merges it). R025 refuses proposeFlight for any definition without this key; parachute has none. What stays
# human whatever this says: secrets, signers, cloud deploy identity, the gates, deploy.target, deploy.chart, api. The app's
# cicd.yaml change is checked by glidepath-api as an agent's change (no gate off); resume is derived from GitHub, so a
# rerun duplicates nothing. repos.allow is read by Clearance's agent-scope gate (AS003) on every PR the tool opens. No
# repo or run tool is listed and children are zero, so even a definition edit that added one would meet R010/R011.
profile:
  tierCeiling: T1
  tools: [airframe.capabilities, airframe.explain, airframe.plan, airframe.apply, airframe.status, airframe.describe,
          airframe.verify, human.request]
  airframe: { apps: ["*"], proposeFlight: true }
  repos: { allow: ["jfillman/*"] }
  models: [claude-sonnet-5-5]
  network: clearance+model
  compute: small
  limits: { ttlMinutes: 30, toolCalls: 60, githubCalls: 150, openPrs: 6, modelTokens: 300000, children: 0 }
runtime:
  image: ghcr.io/jfillman/autopilot-agent-runtime@sha256:b5c9832f0d5d092e616a98e365862eb1e03a15dffe2d545f97c9adfed7f1d965
  framework: generic
  instructions: >-
    Bring the app in your input up through airframe.apply, and change nothing any other way. If the input is plain
    language, first use airframe.capabilities, explain and plan to make an AppSpec; if anything is ambiguous or
    unsupported, ask with human.request, never guess a field.
    1. airframe.plan the spec (baseCicd if you have it). On needsInput or an AF-SPEC error, stop and report the question.
    2. airframe.apply, same spec, `proposeFlight: true` (every environment named, Flight too): ONE PR per call.
    `awaiting-merge`: human.request with the PR link, what merging it does (`merge: person` = a Flight change only a
    person may merge) and what comes next; poll human.request.get. `waiting` (reason): report, or ask if a PR was closed.
    `agent-steps-merged`: done.
    3. Merged: say which PR (and who, if reported), then apply again with the identical spec; likewise after an interruption.
    4. `humanSteps` (a field that stays human, with its rule): report repo, paths, reason; never open them otherwise.
    Check progress with airframe.status, describe, verify. Final report: every PR link, merged or open, who is awaited,
    rule ids of failures.
triggers: [ { type: manual } ]
