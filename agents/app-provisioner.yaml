name: app-provisioner
description: "Provisions any app from an AppSpec, or from a plain-language request turned into one: opens each step of its plan as a pull request for a person to merge, and picks up where an earlier run stopped."
owner: group:default/team-platform
kind: task
identity: { type: delegated }
# The general provisioning agent, beside agents/parachute.yaml. parachute is the narrow A-3 test agent (app `parachute`
# only, R023); this one stands up ANY app from an AppSpec with any option the Airframe planner supports, through the same
# airframe.apply tool, so authority is wider here by design (profile.airframe.apps "*", repos.allow "jfillman/*"). What
# bounds it is unchanged from parachute: T1; its one write is airframe.apply, which opens PRs through the agents' GitHub
# App and only to the tenants repo and the app's repo; no merge, approve or push tool, so a person merges every PR;
# apply never opens the Flight half (cicd.yaml's Flight fields, gitops-<app>), which stays human-only; the app's cicd.yaml
# change is checked against R021's field scope (no gate off, no Flight environment); resume is derived from GitHub, so a
# rerun duplicates nothing. repos.allow is read by Clearance's agent-scope gate (AS003) on every PR the tool opens. No
# repo or run tool is listed and children are zero, so even a definition edit that added one would meet R010/R011.
profile:
  tierCeiling: T1
  tools: [airframe.capabilities, airframe.explain, airframe.plan, airframe.apply, airframe.status, airframe.describe,
          airframe.verify, human.request]
  airframe: { apps: ["*"] }
  repos: { allow: ["jfillman/*"] }
  models: [claude-sonnet-5-5]
  network: clearance+model
  compute: small
  limits: { ttlMinutes: 30, toolCalls: 60, githubCalls: 150, openPrs: 6, modelTokens: 300000, children: 0 }
runtime:
  image: ghcr.io/jfillman/autopilot-agent-runtime@sha256:b1c7b65ba8405726879f27f18982d455cdb4f6c25cdb09eddd642b21e8fbbe6a
  framework: generic
  instructions: >-
    Bring the app described by the AppSpec in your input up through airframe.apply, and change nothing any other way.
    If the input is a plain-language request, first use airframe.capabilities, airframe.explain and airframe.plan to
    turn it into an AppSpec; if anything is ambiguous or unsupported, ask with human.request, never guess or invent a field.
    1. airframe.plan the spec (pass baseCicd when you have the app's cicd.yaml). On needsInput or an AF-SPEC error, stop
    and report the question.
    2. airframe.apply with the same spec: ONE pull request per call, or the one already open. Read `state`:
    `awaiting-merge` means a person must merge `url` (say so and stop; call again only once told it is merged, or ask
    with human.request); `waiting` carries a `reason`: if the platform is still creating something, report and stop; if
    a PR was closed, stop and ask with human.request. `agent-steps-merged` means all this tool opens is merged.
    3. After a merge, call airframe.apply again with the identical spec for the next step. After an interruption do the
    same: it resumes from GitHub and never duplicates a PR.
    4. `humanSteps` are the Flight half: report them (repo, paths, reason) for a person; never open them another way.
    Check progress with airframe.status, airframe.describe, and airframe.verify once the environments are up. Report
    each PR link, what is merged, what waits and on whom, and any failure with its rule id.
triggers: [ { type: manual } ]
