name: parachute
description: "Provisions an app from an AppSpec: opens each step of its plan as a pull request for a person to merge, and picks up where an earlier run stopped."
owner: group:default/team-platform
kind: task
identity: { type: delegated }
# Package A-3, the parachute test: one statement of intent (examples/parachute.appspec.yaml) to a running app, with a
# person merging every step. Its one write is airframe.apply (T1), which re-plans the AppSpec itself and opens the next
# step as a PR through the agents' GitHub App: the tenants repo, then the app's repo. It has no merge, approve or
# push tool, and it does not set profile.airframe.proposeFlight (app-provisioner does), so apply never opens the Flight half
# (cicd.yaml's Flight fields, gitops-<app>): those stay with people, and R025 refuses a call that asks.
# Resume is not memory: apply derives where it is from GitHub (branches fixed by the plan), so a run killed at any
# point and started again with the same AppSpec opens no duplicate and loses nothing. profile.airframe.apps is the
# whole scope: an AppSpec for another app is refused (R023) before apply runs. No repo or run tool is listed, and
# children are zero, so even a definition edit that added one would meet R010/R011.
profile:
  tierCeiling: T1
  tools: [airframe.capabilities, airframe.explain, airframe.plan, airframe.apply, airframe.status, airframe.describe,
          airframe.verify, human.request]
  airframe: { apps: ["parachute"] }
  # Not read by the core for apply (its arguments name no repo), but by Clearance's agent-scope gate on every PR the tool
  # opens: AS003 flags a PR on a repo outside this list. The app's repo, and the tenants repo (AIRFRAME_TENANTS_REPO).
  repos: { allow: ["jfillman/parachute", "jfillman/gitops-hangar-dev-tenants"] }
  models: [claude-sonnet-5-5]
  network: clearance+model
  compute: small
  limits: { ttlMinutes: 60, toolCalls: 80, githubCalls: 150, openPrs: 6, modelTokens: 300000, children: 0 }
runtime:
  image: ghcr.io/jfillman/autopilot-agent-runtime@sha256:b1c7b65ba8405726879f27f18982d455cdb4f6c25cdb09eddd642b21e8fbbe6a
  framework: generic
  instructions: >-
    Bring app `parachute` up with airframe.apply; change nothing any other way. The spec must say EVERYTHING asked.
    1. Call airframe.capabilities ONCE with section `appspec` (fields, config/overrides, worked example); write the spec
    from it, never guess fields.
    2. airframe.plan the spec (baseCicd if you have it): at most 3 plan calls. Still failing, or needsInput: STOP, ask
    with human.request.
    3. Anything asked that the AppSpec cannot express: STOP, ask with human.request. Never proceed with less than asked.
    4. airframe.apply, same spec; one PR per call. `awaiting-merge`: human.request "merge <url>, then reply", poll
    human.request.get, then apply again in this run. `waiting` (see reason; an open onboarding resync PR is one): ask a
    person with human.request, continue. Closed PR or APPLY-CONFLICT (a person set that key): ask, name the keys.
    `agent-steps-merged`: done.
    5. `humanSteps` are the Flight half: report repo, paths, reason; never open them. airframe.status/describe/verify
    show progress.
    6. EVERY stop before done: end the report with a ready-to-paste RESUME PROMPT holding the exact AppSpec JSON.
    Report each PR link, what is merged, who is awaited, and rule ids of failures.
triggers: [ { type: manual } ]
