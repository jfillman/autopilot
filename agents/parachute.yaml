name: parachute
description: "Provisions an app from an AppSpec: opens each step of its plan as a pull request for a person to merge, and picks up where an earlier run stopped."
owner: group:default/team-platform
kind: task
identity: { type: delegated }
# Package A-3, the parachute test: one statement of intent (examples/parachute.appspec.yaml) to a running app, with a
# person merging every step. Its one write is airframe.apply (T1), which re-plans the AppSpec itself and opens the next
# step as a PR through the agents' GitHub App: the tenants repo, then the app's repo. It has no merge, approve or
# push tool. profile.airframe.proposeFlight (owner decision 2026-11-12) lets apply also open the Flight half (cicd.yaml's
# Flight fields, gitops-<app>) as PRs marked for a person to merge; opening changes nothing, the merge is the control.
# Resume is not memory: apply derives where it is from GitHub (branches fixed by the plan), so a run killed at any
# point and started again with the same AppSpec opens no duplicate and loses nothing. profile.airframe.apps is the
# whole scope: an AppSpec for another app is refused (R023) before apply runs. No repo or run tool is listed, and
# children are zero, so even a definition edit that added one would meet R010/R011.
profile:
  tierCeiling: T1
  tools: [airframe.capabilities, airframe.explain, airframe.plan, airframe.apply, airframe.status, airframe.describe,
          airframe.verify, human.request]
  airframe: { apps: ["parachute"], proposeFlight: true }
  # Not read by the core for apply (its arguments name no repo), but by Clearance's agent-scope gate on every PR the tool
  # opens: AS003 flags a PR on a repo outside this list. The app's repo, its gitops repo (the Flight values), and the tenants
  # repo (AIRFRAME_TENANTS_REPO).
  repos: { allow: ["jfillman/parachute", "jfillman/gitops-parachute", "jfillman/gitops-hangar-dev-tenants"] }
  models: [claude-sonnet-5-5]
  network: clearance+model
  compute: small
  limits: { ttlMinutes: 60, toolCalls: 80, githubCalls: 150, openPrs: 6, modelTokens: 300000, children: 0 }
runtime:
  image: ghcr.io/jfillman/autopilot-agent-runtime@sha256:b5c9832f0d5d092e616a98e365862eb1e03a15dffe2d545f97c9adfed7f1d965
  framework: generic
  instructions: >-
    Bring app `parachute` up with airframe.apply; change nothing any other way. The spec must say EVERYTHING asked.
    1. airframe.capabilities ONCE, section `appspec`; write the spec from it, never guess fields.
    2. airframe.plan the spec (baseCicd if you have it), at most 3 calls. Failing or needsInput: STOP, ask with human.request.
    3. Anything the AppSpec cannot express: STOP, ask. Never proceed with less than asked.
    4. airframe.apply, same spec, `proposeFlight: true`; one PR per call. `awaiting-merge`: human.request "merge <url>,
    then reply": what merging it does (`merge: person` = a Flight change only a person may merge) and what comes next;
    poll human.request.get. Merged: say which PR (and who, if reported), then apply again in this run. `waiting` (reason):
    ask, continue. Closed PR or APPLY-CONFLICT: ask, name the keys. `agent-steps-merged`: done.
    5. `humanSteps`: report repo, paths, reason; never open them. airframe.status/describe/verify show progress.
    6. EVERY stop before done: end with a ready-to-paste RESUME PROMPT holding the exact AppSpec JSON.
    Final report: every PR link, merged or open, who is awaited, rule ids of failures.
triggers: [ { type: manual } ]
