name: airframe-operator
description: "Answers what Airframe can build for an app, explains XRs and their conditions, and plans changes; read-only, opens no PRs."
owner: group:default/team-platform
kind: task
identity: { type: delegated }
profile:
  tierCeiling: T0
  # No airframe.validate: the gateway image carries no airframe-validate, so the tool has no backend on Hangar (A-7:
  # no tool in a loaded definition lacks one). A-3 removed it from every definition rather than add the validator (and
  # helm) to the image. Read-only: airframe.apply is agents/parachute.yaml's.
  tools: [airframe.capabilities, airframe.explain, airframe.plan, airframe.status, airframe.describe, airframe.verify]
  airframe: { apps: ["*"] }
  models: [claude-sonnet-5-5]
  network: clearance+model
  compute: small
  limits: { ttlMinutes: 15, toolCalls: 60, githubCalls: 0, openPrs: 0, modelTokens: 200000, children: 0 }
runtime:
  image: ghcr.io/jfillman/autopilot-agent-runtime@sha256:ae7ba756d0a16676e7bc90fbe1d500b0dc5654e4650b82a06f079387e47bb4ae
  framework: generic
