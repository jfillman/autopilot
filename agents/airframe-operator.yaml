name: airframe-operator
description: "Answers what Airframe can build for an app, validates and explains XRs, and plans changes; read-only, opens no PRs."
owner: group:default/team-platform
kind: task
identity: { type: delegated }
profile:
  tierCeiling: T0
  tools: [airframe.capabilities, airframe.validate, airframe.explain, airframe.plan, airframe.status, airframe.describe, airframe.verify]
  airframe: { apps: ["*"] }
  models: [claude-sonnet-5-5]
  network: clearance+model
  compute: small
  limits: { ttlMinutes: 15, toolCalls: 60, githubCalls: 0, openPrs: 0, modelTokens: 200000, children: 0 }
runtime:
  image: ghcr.io/jfillman/autopilot-agent-runtime@sha256:9231350fb98d5a0f71ce705669e921cba38e91928096b435faa49246d655f083
  framework: generic
