[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autopilot"
version = "0.1.0.dev0"
description = "Autopilot: Hangar's AI agent runtime (agent definitions, Preflight, tool backends) on Clearance"
requires-python = ">=3.11"
# Clearance is its own product and repo (Hangar D16), pinned by tag; bump it here when clearance releases.
dependencies = ["clearance[serve,pg] @ git+https://github.com/jfillman/clearance@v0.21.0", "jsonschema>=4.20", "pyyaml>=6", "mcp>=2"]

[project.scripts]
# The deployable gateway (src/autopilot/serve.py; README "Running the gateway").
autopilot-gateway = "autopilot.serve:main"

[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
# anthropic: the agent runtime's model client (runtime/, tests/test_runtime_*.py).
test = ["pytest>=8", "anthropic>=0.40,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/autopilot"]

[tool.pytest.ini_options]
# function-agentrun's tests live with it in airframe (functions/function-agentrun, CI's compositions job).
testpaths = ["tests"]
# runtime/src: the agent runtime (runtime/pyproject.toml), its own package and image.
pythonpath = ["src", "runtime/src"]
