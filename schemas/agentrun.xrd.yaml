# AgentRun (Autopilot AP-A3): one bounded, disposable run of an agent definition. The EPHEMERAL half of an agent
# workload; the durable half, the agent definition, is reviewed YAML in the autopilot repo (agents/*.yaml, schema
# schemas/agent-definition.schema.json). Decision D2 (hangar docs/autopilot/decisions.md).
#
# Who creates it: Clearance, directly through the Kubernetes API (not a git commit), in the reserved namespace
# autopilot-runs, on the control-plane (dev) cluster only. Clearance's one Kubernetes permission is a namespaced Role
# on this kind in that namespace (create/get/list/watch/patch/delete; patch sets spec.frozen). The caller passes no
# manifest: this schema constrains every field, and the composition decides what is created.
#
# What it composes (function-agentrun, functions/function-agentrun): provider-kubernetes Objects only, because
# Crossplane v2 rejects a namespaced XR composing a cluster-scoped resource (the run's Namespace), the same reason
# SecretStore wraps ClusterSecretStore. The Objects are the run namespace agent-<name> (pod security restricted,
# labelled hangar.io/agent-run, never hangar.io/ephemeral-env), a ResourceQuota, default-deny and per-network-mode
# egress NetworkPolicies, the ServiceAccount `run`, and one agent-sandbox `Sandbox` (kubernetes-sigs/agent-sandbox,
# agents.x-k8s.io/v1beta1) that runs the agent pod.
#
# Expiry needs no Clearance and no Crossplane: the Sandbox carries shutdownTime = spec.expiresAt with
# shutdownPolicy Delete, so the agent-sandbox controller removes the pod within about a second of the deadline
# (U11), and the pod's activeDeadlineSeconds is a kubelet-enforced backstop if that controller is down. Past
# expiresAt the function also renders nothing, so Crossplane removes the namespace on its next reconcile (about
# every 60 s, U2): the poll is status refresh, not the deadline.
#
# Fails closed: a hardened sandbox on a cluster with no runtime class, a compute class the cluster lacks, a TTL over
# the cluster cap, an allowlist of 0.0.0.0/0, an input over 4 KiB, an XR outside autopilot-runs, or a cluster
# whose registry record lacks airframe.autopilotReady is Rejected and renders nothing. Never downgraded.
#
# Test via a copy first (AGENTS.md): this XRD and composition are not in any cluster's airframe-service-catalog
# include list until the copy-test on the dev cluster passes.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: agentruns.catalog.hangar.io
  annotations:
    # High-churn ephemeral objects: keep them out of the Backstage catalog and the scaffolder.
    terasky.backstage.io/add-to-catalog: "false"
    hangar.io/catalog-exclusion: "Created by Clearance through the Kubernetes API for one agent run; never requested from git or the portal."
    hangar.io/agent-summary: "One bounded, disposable run of an Autopilot agent in its own sandboxed namespace, with a hard deadline that needs no gateway to enforce."
spec:
  group: catalog.hangar.io
  names:
    kind: AgentRun
    plural: agentruns
    singular: agentrun
  scope: Namespaced
  # Review C13: deterministic Composition choice for an XR that names none (there is one per kind). The copy-test
  # points one scratch XR at a second Composition through spec.crossplane.compositionRef instead.
  defaultCompositionRef:
    name: agentruns.catalog.hangar.io
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: PHASE
          type: string
          jsonPath: ".status.phase"
          description: "Lifecycle phase (closed set: Provisioning, Running, Succeeded, Failed, Frozen, Expired, Drained, Rejected)"
        - name: RUN
          type: string
          jsonPath: ".status.conditions[?(@.type=='RunReady')].reason"
          description: "RunReady reason (closed set in xrds/agentrun.meta.yaml)"
        - name: EXPIRES
          type: string
          jsonPath: ".spec.expiresAt"
          description: "The hard deadline"
      schema:
        openAPIV3Schema:
          type: object
          description: "AgentRun: One bounded, disposable run of an Autopilot agent in its own sandboxed namespace, with a hard deadline that needs no gateway to enforce."
          x-kubernetes-validations:
            - rule: "self.metadata.name.matches('^r-[a-f0-9]{6,32}$')"
              message: "an AgentRun is named r-<session hex> (Clearance's run name); its pods run in the namespace agent-<name>, which the cluster's admission policy expects to match agent-r-*"
          properties:
            metadata:
              type: object
              description: "Standard object metadata. The name is constrained by the rule above (r-<6 to 32 hex>)."
              properties:
                name:
                  type: string
                  maxLength: 34
                  description: "r-<6 to 32 lowercase hex>: the run's session id without its s- prefix. The run namespace is agent-<name>."
            spec:
              type: object
              description: >-
                What this run may do. Every field is something a run may only narrow relative to its agent
                definition (Clearance enforces that) and the composition holds to the cluster's own caps. The
                spec is fixed at creation; only frozen may change, and only from false to true.
              required: [agent, image, expiresAt, taskId, sessionId, compute, sandbox, network, limits]
              x-kubernetes-validations:
                - rule: "has(self.parentSessionId) == has(oldSelf.parentSessionId) && has(self.sidecars) == has(oldSelf.sidecars) && has(self.input) == has(oldSelf.input)"
                  message: "an AgentRun's spec is fixed at creation: parentSessionId, sidecars and input can't be added or removed afterwards"
              properties:
                agent:
                  type: string
                  pattern: "^[a-z][a-z0-9-]{1,40}$"
                  description: Name of the durable agent definition this run instantiates (autopilot agents/<agent>.yaml).
                  x-kubernetes-validations:
                    - {rule: "self == oldSelf", message: "agent can't change after creation"}
                image:
                  type: string
                  pattern: '^[^\s@]+@sha256:[a-f0-9]{64}$'
                  description: >-
                    The agent's container image, pinned by digest (registry/repo@sha256:...). A tag is rejected,
                    because what runs must be what was signed.
                  x-kubernetes-validations:
                    - {rule: "self == oldSelf", message: "image can't change after creation"}
                framework:
                  type: string
                  enum: [claude-agent-sdk, langgraph, generic]
                  default: generic
                  description: >-
                    The agent framework, recorded for the audit and the Flight recorder. It does not change what
                    is rendered: every framework gets the same runtime contract (environment, files, tokens).
                  x-kubernetes-validations:
                    - {rule: "self == oldSelf", message: "framework can't change after creation"}
                sandbox:
                  type: string
                  enum: [standard, hardened]
                  description: >-
                    standard: pod security restricted, non-root, read-only root filesystem, all capabilities
                    dropped. hardened adds the cluster's runtime class for it (gVisor or Kata, from the
                    composition's runtime_classes). If the cluster has none, the run is Rejected; it is never
                    silently downgraded to standard.
                  x-kubernetes-validations:
                    - {rule: "self == oldSelf", message: "sandbox can't change after creation"}
                compute:
                  type: string
                  enum: [small, medium, large, gpu]
                  description: >-
                    Compute class. The composition's input declares which classes this cluster has and their
                    requests and limits; a class the cluster lacks is Rejected.
                  x-kubernetes-validations:
                    - {rule: "self == oldSelf", message: "compute can't change after creation"}
                network:
                  type: object
                  required: [mode]
                  description: >-
                    Egress, ordered by reach. Every run gets a default-deny NetworkPolicy (ingress and egress);
                    the mode adds exactly these exceptions: none (nothing, not even DNS), clearance (DNS and the
                    Clearance gateway), clearance+model (also the model proxy), allowlist (also the listed CIDRs).
                  x-kubernetes-validations:
                    - rule: "self.mode == 'allowlist' ? (has(self.allowCidrs) && size(self.allowCidrs) > 0) : !has(self.allowCidrs)"
                      message: "allowCidrs is required with network mode allowlist and not allowed with any other mode"
                    - {rule: "self == oldSelf", message: "network can't change after creation; freeze the run to cut its egress"}
                  properties:
                    mode:
                      type: string
                      enum: [none, clearance, clearance+model, allowlist]
                      description: The egress mode (see network).
                    allowCidrs:
                      type: array
                      maxItems: 8
                      description: >-
                        Only with mode allowlist: IPv4 CIDRs the run may reach, besides Clearance and the model
                        proxy. A /0 is not accepted by this pattern, and the function also rejects loopback and
                        link-local ranges.
                      items:
                        type: string
                        pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}/([1-9]|[12][0-9]|3[0-2])$'
                        description: An IPv4 CIDR with a prefix of /1 to /32.
                expiresAt:
                  type: string
                  format: date-time
                  description: >-
                    Hard deadline (RFC 3339, UTC). It becomes the Sandbox's shutdownTime, so the agent-sandbox
                    controller deletes the run's pod at this instant with no Clearance and no Crossplane involved.
                    Past it the composition renders nothing and Crossplane removes the run namespace. At most the
                    cluster's max_ttl_minutes after the XR's creation.
                  x-kubernetes-validations:
                    - {rule: "self == oldSelf", message: "expiresAt can't change after creation: a run's deadline is never extended"}
                taskId:
                  type: string
                  pattern: "^t-[a-f0-9]{6,32}$"
                  description: The task this run belongs to (Flight recorder correlation id), passed to the run as HANGAR_TASK_ID.
                  x-kubernetes-validations:
                    - {rule: "self == oldSelf", message: "taskId can't change after creation"}
                sessionId:
                  type: string
                  pattern: "^s-[a-f0-9]{6,32}$"
                  description: Clearance's session id for this run, passed to the run as HANGAR_SESSION_ID. The XR's name is r-<the same hex>.
                  x-kubernetes-validations:
                    - {rule: "self == oldSelf", message: "sessionId can't change after creation"}
                parentSessionId:
                  type: string
                  pattern: "^s-[a-f0-9]{6,32}$"
                  description: For a child run of a team, the parent's session id. Clearance narrows a child to its parent's limits.
                  x-kubernetes-validations:
                    - {rule: "self == oldSelf", message: "parentSessionId can't change after creation"}
                limits:
                  type: object
                  required: [toolCalls, githubCalls, modelTokens]
                  description: >-
                    The run's narrowed budgets, passed to it as HANGAR_LIMITS for its own information. Clearance is
                    what enforces them, at each call.
                  x-kubernetes-validations:
                    - {rule: "self == oldSelf", message: "limits can't change after creation"}
                  properties:
                    toolCalls: {type: integer, minimum: 0, description: Tool calls the session may make through Clearance.}
                    githubCalls: {type: integer, minimum: 0, description: GitHub API calls the session may cause.}
                    modelTokens: {type: integer, minimum: 0, description: Model tokens the session may spend through the model proxy.}
                sidecars:
                  type: array
                  maxItems: 4
                  description: >-
                    Extra containers from the agent definition (tool servers and the like). Each gets the same
                    lockdown as the agent container, a small fixed resource budget, /tmp only, and none of the
                    run's environment or tokens.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  x-kubernetes-validations:
                    - {rule: "self == oldSelf", message: "sidecars can't change after creation"}
                  items:
                    type: object
                    required: [name, image]
                    description: One sidecar container.
                    x-kubernetes-validations:
                      - {rule: "self.name != 'agent'", message: "the sidecar name agent is the agent container's"}
                    properties:
                      name: {type: string, pattern: "^[a-z][a-z0-9-]{1,30}$", description: Container name; not agent.}
                      image: {type: string, pattern: '^[^\s@]+@sha256:[a-f0-9]{64}$', description: Image pinned by digest.}
                input:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  maxProperties: 64
                  description: >-
                    Small structured input, passed to the run as HANGAR_INPUT (compact JSON). Over 4 KiB of JSON is
                    Rejected: pass a reference (an artifact name) for anything larger.
                frozen:
                  type: boolean
                  default: false
                  description: >-
                    Set by Clearance when the session breaker trips. Cuts all egress (only the default-deny policy
                    stays) and keeps the run for forensics for freezeHoldMinutes, then expires it. A frozen run
                    can't be unfrozen.
                  x-kubernetes-validations:
                    - {rule: "!oldSelf || self", message: "a frozen run can't be unfrozen"}
                freezeHoldMinutes:
                  type: integer
                  minimum: 1
                  maximum: 240
                  default: 15
                  description: How long a frozen run is kept for forensics before it expires. Never past expiresAt.
                  x-kubernetes-validations:
                    - {rule: "self == oldSelf", message: "freezeHoldMinutes can't change after creation"}
            status:
              type: object
              description: Written by function-agentrun on every reconcile (about every 60 s). The RunReady condition carries the same phase as a closed reason set.
              properties:
                phase:
                  type: string
                  enum: [Provisioning, Running, Succeeded, Failed, Frozen, Expired, Drained, Rejected]
                  description: >-
                    Provisioning (objects created, the sandbox not Ready yet), Running (the sandbox is Ready),
                    Succeeded or Failed (the agent exited; kept for the completion grace period), Frozen (egress
                    cut by Clearance), Expired (past expiresAt or the freeze hold), Drained (finished and removed),
                    Rejected (the request can't be honoured exactly on this cluster; nothing rendered). Expired,
                    Drained and Rejected are final: the run never renders again.
                reason: {type: string, description: Why the run is in this phase, for a person. Empty while it is healthy.}
                outcome: {type: string, enum: [Succeeded, Failed], description: How the agent exited, kept after the run drains.}
                cluster: {type: string, description: The cluster registry record the run was admitted against.}
                namespace: {type: string, description: The run namespace, agent-<name>.}
                sandbox: {type: string, description: The Sandbox (and pod) name in the run namespace.}
                expiresAt: {type: string, description: Copy of spec.expiresAt, the Sandbox's shutdownTime.}
                createdAt: {type: string, description: The XR's creation time, which the TTL cap and the pod deadline are anchored to.}
                finishedAt: {type: string, description: When the agent pod reached a terminal phase.}
                frozenAt: {type: string, description: When the function first saw spec.frozen.}
          required: ["spec"]
